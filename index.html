<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Chat - Azure Edition</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e1e 0%, #2d2d30 100%);
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    #chat {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      background: rgba(30, 30, 30, 0.8);
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    h2 {
      text-align: center;
      color: #007acc;
      margin-bottom: 20px;
    }
    .status {
      text-align: center;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      background: rgba(0, 122, 204, 0.2);
      border: 1px solid #007acc;
    }
    .status.error {
      background: rgba(204, 0, 0, 0.2);
      border-color: #cc0000;
    }
    .status.success {
      background: rgba(0, 204, 0, 0.2);
      border-color: #00cc00;
    }
    #messages {
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 15px;
      padding: 10px;
    }
    .message {
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user {
      background: linear-gradient(135deg, #007acc 0%, #005a9e 100%);
      text-align: right;
      margin-left: auto;
    }
    .bot {
      background: linear-gradient(135deg, #444 0%, #333 100%);
      text-align: left;
      margin-right: auto;
    }
    .system {
      background: rgba(255, 165, 0, 0.2);
      text-align: center;
      margin: 10px auto;
      font-style: italic;
      color: #ffa500;
    }
    #inputBox {
      display: flex;
      padding: 10px 0;
      gap: 10px;
    }
    #inputBox input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #007acc;
      border-radius: 8px;
      background: #2d2d30;
      color: #fff;
      font-size: 14px;
    }
    #inputBox input:focus {
      outline: none;
      border-color: #00a6ff;
      box-shadow: 0 0 5px rgba(0, 166, 255, 0.5);
    }
    #inputBox button {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #007acc 0%, #005a9e 100%);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    #inputBox button:hover {
      background: linear-gradient(135deg, #00a6ff 0%, #007acc 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 122, 204, 0.3);
    }
    #inputBox button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }
    .loading {
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="chat">
    <h2>Claude Chat - Azure Edition</h2>
    <div id="status" class="status">Initializing...</div>
    <div id="messages"></div>
    <div id="inputBox">
      <input id="userInput" type="text" placeholder="Type your message and press Enter..." />
      <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    // Configuration
    const API_ENDPOINT = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:7071/api/chat'  // Local development
      : '/api/chat';  // Azure production

    let conversationHistory = [];
    let isReady = false;
    let isSending = false;

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      checkBackendHealth();
      document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !isSending) {
          sendMessage();
        }
      });
    });

    async function checkBackendHealth() {
      const statusEl = document.getElementById('status');

      try {
        // Simple connectivity check
        statusEl.className = 'status success';
        statusEl.textContent = '✓ Connected to Azure - Ready to chat with Claude!';
        isReady = true;
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = '✗ Backend not available. Make sure Azure Functions is running.';
        isReady = false;
      }
    }

    function addMessage(sender, text) {
      const msg = document.createElement("div");
      msg.className = "message " + sender;
      msg.textContent = text;
      const messagesEl = document.getElementById("messages");
      messagesEl.appendChild(msg);
      msg.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const text = input.value.trim();

      if (!text || isSending) return;

      if (!isReady) {
        addMessage("system", "System not ready. Please wait for connection...");
        return;
      }

      // Disable input while sending
      isSending = true;
      sendBtn.disabled = true;
      sendBtn.textContent = "Sending...";

      // Add user message to UI
      addMessage("user", text);
      input.value = "";

      // Add loading indicator
      const loadingMsg = document.createElement("div");
      loadingMsg.className = "message bot loading";
      loadingMsg.textContent = "Claude is thinking...";
      loadingMsg.id = "loading-msg";
      document.getElementById("messages").appendChild(loadingMsg);
      loadingMsg.scrollIntoView({ behavior: 'smooth', block: 'end' });

      try {
        // Call Azure Functions backend
        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: text,
            conversationHistory: conversationHistory
          })
        });

        // Remove loading message
        const loadingElement = document.getElementById("loading-msg");
        if (loadingElement) {
          loadingElement.remove();
        }

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        // Add bot response
        addMessage("bot", data.response);

        // Update conversation history
        conversationHistory.push(
          { role: 'user', content: text },
          { role: 'assistant', content: data.response }
        );

        // Keep conversation history manageable (last 20 messages)
        if (conversationHistory.length > 20) {
          conversationHistory = conversationHistory.slice(-20);
        }

      } catch (error) {
        // Remove loading message
        const loadingElement = document.getElementById("loading-msg");
        if (loadingElement) {
          loadingElement.remove();
        }

        console.error('Error:', error);
        addMessage("system", `Error: ${error.message}. Please try again.`);
      } finally {
        // Re-enable input
        isSending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        input.focus();
      }
    }
  </script>
</body>
</html>
