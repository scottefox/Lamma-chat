<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Chat - ILE Protected</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1d 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        order: -1;
      }
    }

    .header {
      grid-column: 1 / -1;
      background: rgba(20, 20, 20, 0.9);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #007acc;
      box-shadow: 0 0 20px rgba(0, 122, 204, 0.3);
      margin-bottom: 10px;
    }

    .header h1 {
      color: #007acc;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header .subtitle {
      color: #888;
      font-size: 14px;
    }

    .ile-badge {
      display: inline-block;
      background: linear-gradient(135deg, #007acc 0%, #005a9e 100%);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }

    .main-chat {
      background: rgba(30, 30, 30, 0.8);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 200px);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .panel {
      background: rgba(30, 30, 30, 0.9);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .panel-header {
      font-weight: bold;
      color: #007acc;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #444;
      font-size: 14px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(0, 122, 204, 0.1);
      border-radius: 5px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff00;
      animation: pulse 2s infinite;
    }

    .status-dot.warning {
      background: #ffa500;
    }

    .status-dot.error {
      background: #ff0000;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
      padding: 10px;
    }

    .message {
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      background: linear-gradient(135deg, #007acc 0%, #005a9e 100%);
      text-align: right;
      margin-left: auto;
    }

    .bot {
      background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
      text-align: left;
      margin-right: auto;
      border: 1px solid #444;
    }

    .bot.vetted {
      border-color: #00ff00;
      box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
    }

    .bot.quarantined {
      background: linear-gradient(135deg, #660000 0%, #440000 100%);
      border-color: #ff0000;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    .system {
      background: rgba(255, 165, 0, 0.2);
      text-align: center;
      margin: 10px auto;
      font-style: italic;
      color: #ffa500;
      border: 1px solid #ffa500;
    }

    .vet-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
      font-weight: bold;
    }

    .vet-badge.passed {
      background: rgba(0, 255, 0, 0.2);
      color: #00ff00;
      border: 1px solid #00ff00;
    }

    .vet-badge.failed {
      background: rgba(255, 0, 0, 0.2);
      color: #ff0000;
      border: 1px solid #ff0000;
    }

    #inputBox {
      display: flex;
      padding: 10px 0;
      gap: 10px;
    }

    #inputBox input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #007acc;
      border-radius: 8px;
      background: #2d2d30;
      color: #fff;
      font-size: 14px;
    }

    #inputBox input:focus {
      outline: none;
      border-color: #00a6ff;
      box-shadow: 0 0 5px rgba(0, 166, 255, 0.5);
    }

    #inputBox button {
      padding: 12px 24px;
      border: none;
      background: linear-gradient(135deg, #007acc 0%, #005a9e 100%);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    #inputBox button:hover {
      background: linear-gradient(135deg, #00a6ff 0%, #007acc 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 122, 204, 0.3);
    }

    #inputBox button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }

    .approval-item {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #ff0000;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .approval-header {
      font-weight: bold;
      color: #ff6b6b;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .approval-details {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .approval-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .btn-approve {
      background: linear-gradient(135deg, #00ff00 0%, #00aa00 100%);
      color: #000;
    }

    .btn-approve:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 255, 0, 0.3);
    }

    .btn-reject {
      background: linear-gradient(135deg, #ff0000 0%, #aa0000 100%);
      color: #fff;
    }

    .btn-reject:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(255, 0, 0, 0.3);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11px;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 4px;
    }

    .stat-label {
      color: #888;
      font-size: 10px;
    }

    .stat-value {
      color: #fff;
      font-weight: bold;
      font-size: 14px;
    }

    .loading {
      display: inline-block;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .no-approvals {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        Claude Chat
        <span class="ile-badge">ILE PROTECTED</span>
      </h1>
      <p class="subtitle">Intelligent Lifecycle Engine Active - All outputs vetted by CO with CEO oversight</p>
    </div>

    <div class="main-chat">
      <div id="messages"></div>
      <div id="inputBox">
        <input id="userInput" type="text" placeholder="Type your message and press Enter..." />
        <button onclick="sendMessage()" id="sendBtn">Send</button>
      </div>
    </div>

    <div class="sidebar">
      <!-- System Status -->
      <div class="panel">
        <div class="panel-header">🔐 SYSTEM STATUS</div>
        <div class="status-indicator">
          <div class="status-dot" id="systemStatusDot"></div>
          <span id="systemStatusText">Initializing...</span>
        </div>
        <div class="stat-grid" id="statsGrid">
          <div class="stat-item">
            <div class="stat-label">Active Workers</div>
            <div class="stat-value" id="statWorkers">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Quarantined</div>
            <div class="stat-value" id="statQuarantined">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Outputs Vetted</div>
            <div class="stat-value" id="statVetted">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Failure Rate</div>
            <div class="stat-value" id="statFailureRate">-</div>
          </div>
        </div>
      </div>

      <!-- CEO Approvals -->
      <div class="panel">
        <div class="panel-header">👔 CEO APPROVALS REQUIRED</div>
        <div id="approvalsContainer">
          <div class="no-approvals">No pending approvals</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const API_ENDPOINT = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:7071/api'
      : '/api';

    let conversationHistory = [];
    let isReady = false;
    let isSending = false;
    let statusInterval = null;

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      initializeSystem();
      document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !isSending) {
          sendMessage();
        }
      });

      // Start status polling
      statusInterval = setInterval(updateSystemStatus, 5000);
      updateSystemStatus();
    });

    async function initializeSystem() {
      try {
        await updateSystemStatus();
        isReady = true;
        addMessage("system", "✓ ILE System initialized - All outputs will be vetted for safety");
      } catch (error) {
        addMessage("system", "✗ Failed to initialize ILE System: " + error.message);
      }
    }

    async function updateSystemStatus() {
      try {
        // Get system status
        const statusResponse = await fetch(`${API_ENDPOINT}/ile-status`);
        const status = await statusResponse.json();

        // Update status indicator
        const statusDot = document.getElementById('systemStatusDot');
        const statusText = document.getElementById('systemStatusText');

        if (status.status === 'OPERATIONAL') {
          statusDot.className = 'status-dot';
          statusText.textContent = 'ILE System Operational';
        } else {
          statusDot.className = 'status-dot error';
          statusText.textContent = 'ILE System Error';
        }

        // Update stats
        document.getElementById('statWorkers').textContent = status.system?.ileCO?.activeWorkers || 0;
        document.getElementById('statQuarantined').textContent = status.system?.kernel?.partitions?.quarantinedPartitions || 0;
        document.getElementById('statVetted').textContent = status.system?.detector?.total || 0;
        document.getElementById('statFailureRate').textContent = status.system?.detector?.failureRate || '0%';

        // Get pending approvals
        const approvalsResponse = await fetch(`${API_ENDPOINT}/approvals`);
        const approvals = await approvalsResponse.json();

        updateApprovalsUI(approvals.approvals || []);

      } catch (error) {
        console.error('Failed to update status:', error);
      }
    }

    function updateApprovalsUI(approvals) {
      const container = document.getElementById('approvalsContainer');

      if (approvals.length === 0) {
        container.innerHTML = '<div class="no-approvals">No pending approvals</div>';
        return;
      }

      container.innerHTML = approvals.map(approval => `
        <div class="approval-item">
          <div class="approval-header">⚠️ QUARANTINE ALERT</div>
          <div class="approval-details">
            <strong>Partition:</strong> ${approval.partitionId}<br/>
            <strong>Reason:</strong> ${approval.reason}<br/>
            <strong>Risk Score:</strong> ${approval.vetResult?.riskScore || 'N/A'}/100<br/>
            <strong>Time:</strong> ${new Date(approval.createdAt).toLocaleTimeString()}
          </div>
          <div class="approval-actions">
            <button class="btn btn-approve" onclick="handleApproval('${approval.id}', true)">
              ✓ Approve Replacement
            </button>
            <button class="btn btn-reject" onclick="handleApproval('${approval.id}', false)">
              ✗ Keep Quarantined
            </button>
          </div>
        </div>
      `).join('');
    }

    async function handleApproval(approvalId, approved) {
      try {
        const response = await fetch(`${API_ENDPOINT}/approvals/submit`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            approvalId,
            approved,
            ceoUserId: 'CEO'
          })
        });

        if (!response.ok) {
          throw new Error('Failed to submit approval');
        }

        const result = await response.json();

        addMessage("system", `CEO Decision: ${approved ? 'APPROVED' : 'REJECTED'} - ${approvalId}`);

        // Refresh status
        await updateSystemStatus();

      } catch (error) {
        console.error('Approval error:', error);
        addMessage("system", `Failed to process approval: ${error.message}`);
      }
    }

    function addMessage(sender, text, metadata = {}) {
      const msg = document.createElement("div");
      let className = "message " + sender;

      // Add special classes based on metadata
      if (metadata.vetResult) {
        if (metadata.vetResult.passed) {
          className += " vetted";
        }
        if (metadata.quarantined) {
          className += " quarantined";
        }
      }

      msg.className = className;

      // Add vet badge if applicable
      let badge = '';
      if (metadata.vetResult) {
        if (metadata.quarantined) {
          badge = '<span class="vet-badge failed">QUARANTINED</span>';
        } else if (metadata.vetResult.passed) {
          badge = `<span class="vet-badge passed">VETTED ✓ (${metadata.vetResult.riskScore}/100)</span>`;
        }
      }

      msg.innerHTML = text + badge;

      const messagesEl = document.getElementById("messages");
      messagesEl.appendChild(msg);
      msg.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const text = input.value.trim();

      if (!text || isSending) return;

      if (!isReady) {
        addMessage("system", "System not ready. Please wait...");
        return;
      }

      // Disable input while sending
      isSending = true;
      sendBtn.disabled = true;
      sendBtn.textContent = "Sending...";

      // Add user message to UI
      addMessage("user", text);
      input.value = "";

      // Add loading indicator
      const loadingMsg = document.createElement("div");
      loadingMsg.className = "message bot loading";
      loadingMsg.textContent = "Claude is thinking... (ILE vetting in progress)";
      loadingMsg.id = "loading-msg";
      document.getElementById("messages").appendChild(loadingMsg);
      loadingMsg.scrollIntoView({ behavior: 'smooth', block: 'end' });

      try {
        // Call ILE-protected chat endpoint
        const response = await fetch(`${API_ENDPOINT}/chat-ile`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: text,
            conversationHistory: conversationHistory
          })
        });

        // Remove loading message
        const loadingElement = document.getElementById("loading-msg");
        if (loadingElement) {
          loadingElement.remove();
        }

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        // Add bot response with vet metadata
        addMessage("bot", data.response, {
          vetResult: data.vetResult,
          quarantined: data.quarantined
        });

        // Update conversation history only if not quarantined
        if (!data.quarantined) {
          conversationHistory.push(
            { role: 'user', content: text },
            { role: 'assistant', content: data.response }
          );

          // Keep conversation history manageable
          if (conversationHistory.length > 20) {
            conversationHistory = conversationHistory.slice(-20);
          }
        }

        // Refresh status to show any new quarantines
        if (data.quarantined || !data.vetResult.passed) {
          setTimeout(updateSystemStatus, 1000);
        }

      } catch (error) {
        // Remove loading message
        const loadingElement = document.getElementById("loading-msg");
        if (loadingElement) {
          loadingElement.remove();
        }

        console.error('Error:', error);
        addMessage("system", `Error: ${error.message}. Please try again.`);
      } finally {
        // Re-enable input
        isSending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        input.focus();
      }
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (statusInterval) {
        clearInterval(statusInterval);
      }
    });
  </script>
</body>
</html>
